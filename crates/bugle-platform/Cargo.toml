[package]
name = "bugle-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS platform layer for Bugle: capture, OCR, registration, clipboard, overlays"
build = "build.rs"

[dependencies]
bugle-core.workspace = true
anyhow.workspace = true
image.workspace = true
libc.workspace = true
tracing.workspace = true
# The versions `muda` (via `tray-icon`) uses, for its attributed menu titles.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSString"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
cc.workspace = true
