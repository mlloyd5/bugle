name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request cancels its older run; every commit on main
  # keeps its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Hosted runners grant no Screen Recording, Accessibility or microphone
  # access. Tests that need a display from the window server are compiled as
  # ignored (see crates/bugle-platform/build.rs) and show up as "ignored" in
  # the test output; tests that need Screen Recording check
  # CGPreflightScreenCaptureAccess themselves.
  BUGLE_TEST_NO_SCREEN: 1

jobs:
  check:
    name: cargo xtask check (macOS arm64)
    # macOS 26 on Apple silicon, default Xcode 26.x with the macOS 26 SDK. The
    # shim needs at least the macOS 15 SDK (SCStreamConfiguration
    # showMouseClicks); the deployment target stays 13.0. Pinned rather than
    # macos-latest so an image change is a reviewed edit here.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust (stable, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcrun --show-sdk-version
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's cache but do not write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo xtask check
        run: cargo xtask check
