# Bugle configuration — copy to ~/.config/bugle/config.toml (or `bugle config init`).
# Every key is optional; these are the defaults with comments.

[general]
save_dir = "~/Desktop/Bugle"
# Tokens: {date} {time} {datetime} {year} {month} {day} {hour} {minute} {second}
#         {kind} {label} {id} {app} {title}; unknown tokens are dropped and name
#         clashes get " 2", " 3", … appended
filename_template = "Bugle {date} at {time}"
shutter_sound = false
copy_to_clipboard = false
# history_path = "~/Library/Application Support/bugle/history.jsonl"

[screenshots]
format = "png"            # png | jpeg | webp | tiff
jpeg_quality = 90
window_shadow = true      # keep the window drop shadow in window captures
downscale_retina = false  # save at 1x points instead of 2x pixels

[recordings]
gif_frame_rate = 12
gif_max_size = 1200       # long edge, pixels
video_fps = 30
microphone = false
system_audio = false      # needs the ScreenCaptureKit backend (macOS 14+)
highlight_clicks = false  # screencapture backend only
retina = true
# auto: ScreenCaptureKit (SCStream + AVAssetWriter, H.264 + AAC .mp4) when system
#       audio is requested, otherwise `screencapture -v`
# stream | system: always use that recorder
backend = "auto"

[ocr]
languages = []            # e.g. ["en-US", "de-DE"]; empty = automatic
accurate = true           # VNRequestTextRecognitionLevelAccurate
language_correction = true
engine = "vision"         # "vision" or an AI provider name

[markup]
stroke_color = "#FF3B30"
stroke_width = 4.0
# font_path = "/System/Library/Fonts/Supplemental/Arial Bold.ttf"
font_size = 28.0
background = "none"       # default for canvas.background = "auto"

[api]
bind = "127.0.0.1:4848"
# Bearer token required on every request when set. Recommended; required
# when `bind` is not a loopback address (the server refuses to start).
# token = "change-me"
# Let browser pages call the API. Only takes effect when a token is set.
cors = false

# Global hotkeys for the menu-bar app (`bugle-app`). "mod+mod+key"; modifiers
# cmd, shift, alt/option, ctrl; keys: letters, digits, F1..F24, space, enter…
# An empty string unbinds the action.
[hotkeys]
capture_area = "cmd+shift+4"
capture_screen = "cmd+shift+3"
# capture_window = "cmd+shift+w"
# scroll_capture = "cmd+shift+s"
record = "cmd+shift+5"        # starts an MP4 recording, or stops the active one
# record_gif = "cmd+shift+g"
ocr_latest = "cmd+shift+2"
pin_latest = "cmd+shift+p"

# Quick-access panel shown by `bugle-app` after a capture: thumbnail plus
# Copy · Annotate · Pin · Sync · Reveal. `enabled = false` keeps the plain toast.
[quick_access]
enabled = true
timeout_seconds = 8.0     # closes by itself (paused while hovered); 0 = stay open
position = "top-right"    # top-right | top-left | bottom-right | bottom-left

# ---------------------------------------------------------------------------
# Sync every new capture to storage you own. There is no hosted service: pick
# a folder that Dropbox / iCloud Drive / Syncthing already mirrors, or an
# S3-compatible bucket (AWS S3, MinIO, Garage, Cloudflare R2, Backblaze B2…).
# Set `folder` OR `[sync.s3]`, never both. `bugle sync <source|latest>` syncs
# on demand even when `enabled = false`.
# ---------------------------------------------------------------------------
[sync]
enabled = false
mode = "copy"             # copy | move  (move: the history entry follows the file;
                          # uploads always keep the local file)
kinds = ["screenshot", "scroll_capture", "annotated", "video", "gif"]
# folder = "~/Library/Mobile Documents/com~apple~CloudDocs/Bugle"   # iCloud Drive
# folder = "~/Dropbox/Bugle"

# [sync.s3]
# endpoint = "https://s3.eu-west-1.amazonaws.com"   # or http://127.0.0.1:9000 (MinIO),
#                                                   # https://<account>.r2.cloudflarestorage.com
# bucket = "my-captures"
# region = "eu-west-1"                              # "auto" for R2
# prefix = "bugle"                                  # key prefix, trailing "/" implied
# access_key_env = "AWS_ACCESS_KEY_ID"              # credentials stay in your environment
# secret_key_env = "AWS_SECRET_ACCESS_KEY"
# public_url = "https://captures.example.com"       # link base; default {endpoint}/{bucket}
# The object URL is written to history (`url`) and, unless general.copy_to_clipboard
# puts the image there, copied to the clipboard.

# ---------------------------------------------------------------------------
# AI providers. Kinds:
#   openai      any OpenAI-compatible server (llama.cpp `llama-server`,
#               LM Studio, vLLM, Ollama's /v1, OpenAI, OpenRouter, Groq…)
#               roles: vision, text, transcriber (/audio/transcriptions)
#   ollama      Ollama native API                          roles: vision, text
#   anthropic   Anthropic Messages API                     roles: vision, text
#   whisper_cpp whisper.cpp `server` (/inference)          roles: transcriber
#   command     run a local program                        roles: all
# ---------------------------------------------------------------------------
[ai]
default_vision = "llama"
default_text = "llama"
default_transcriber = "whisper"

[ai.providers.llama]
kind = "openai"
base_url = "http://127.0.0.1:8080/v1"      # llama-server -m llava.gguf --mmproj ...
model = "default"
system_prompt = "You describe screenshots precisely. Name the application, the key UI elements, and any visible text. Be concise."
timeout_seconds = 180
max_tokens = 1024

[ai.providers.ollama]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "llava"

[ai.providers.whisper]
kind = "whisper_cpp"
base_url = "http://127.0.0.1:8178"         # whisper-server -m ggml-base.en.bin --port 8178

[ai.providers.openai]
kind = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"

[ai.providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"

# A local whisper-cli: {input} {output} {language} {prompt} {model} are substituted.
# The program must write SRT to {output} (or `<input>.srt`, or stdout).
# [ai.providers.whisper-cli]
# kind = "command"
# command = ["whisper-cli", "-m", "/models/ggml-base.en.bin", "-l", "{language}", "-osrt", "-of", "{output}", "-f", "{input}"]
