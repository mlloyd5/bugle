# Bugle configuration — copy to ~/.config/bugle/config.toml (or `bugle config init`).
# Every key is optional; these are the defaults with comments.

[general]
save_dir = "~/Desktop/Bugle"
# Tokens: {date} {time} {datetime} {year} {month} {day} {hour} {minute} {second}
#         {kind} {label} {id} {app} {title}; unknown tokens are dropped and name
#         clashes get " 2", " 3", … appended
filename_template = "Bugle {date} at {time}"
shutter_sound = false
copy_to_clipboard = false
# history_path = "~/Library/Application Support/bugle/history.jsonl"
# bugle-app from Bugle.app only: also post finished actions and errors to
# Notification Center. macOS asks once; if notifications are denied (or the
# app runs unbundled) only the panel or toast is shown.
system_notifications = false

[screenshots]
format = "png"            # png | jpeg | webp | tiff
jpeg_quality = 90
window_shadow = true      # keep the window drop shadow in window captures
downscale_retina = false  # save at 1x points instead of 2x pixels
# bugle-app Capture Window: hover to highlight a window, click to capture it.
# Space switches between the picker and the area selection (Capture Area,
# Capture Window, Record Video/GIF/Window).
# false = capture the front-most window at once (the CLI and API always do,
# unless an API caller asks for target kind "pick_window").
window_picker = true

[recordings]
gif_frame_rate = 12       # also the `gif` preset of `bugle edit`
gif_max_size = 1200       # long edge, pixels (also the `gif` preset)
video_fps = 30
microphone = false
system_audio = false      # needs the ScreenCaptureKit backend (macOS 14+)
mix_audio = false         # one audio track instead of microphone + system audio
                          # (re-encodes the audio after stop; each source at 1/2
                          # times its gain below; needs free space equal to the
                          # recording)
# Levels for the mixed track (mix_audio only). Gains are linear factors, 0 to 8,
# on each source's default share of the mix (1/2 with two sources), so 1.0 =
# the default share. With any gain above 1 a peak limiter keeps the sum from
# clipping; at 1 or below the sum cannot clip and the limiter is bypassed.
microphone_gain = 1.0
system_audio_gain = 1.0
ducking = false           # lower system audio while the microphone is active
ducking_amount_db = 12.0  # how far, 0 to 60 dB
ducking_threshold_db = -40.0  # mic peak level (dBFS, as recorded, before
                              # microphone_gain) that counts as active; no
                              # ducking when microphone_gain = 0
ducking_attack_ms = 10.0  # fade down
ducking_release_ms = 500.0  # fade back up once the mic is quiet
highlight_clicks = false  # stream backend: macOS 15+
cursor_events = false     # write <file>.events.json (pointer + clicks) for `bugle edit --zoom`
hide_cursor = false       # leave the pointer out of the frames (stream backend; implies
                          # cursor_events; `bugle edit --smooth-cursor` draws it back)
retina = true
# auto: ScreenCaptureKit (SCStream + AVAssetWriter, H.264 + AAC .mp4) when system
#       audio, hide_cursor or cursor_events is requested, otherwise `screencapture -v`
# stream | system: always use that recorder
backend = "auto"

[ocr]
languages = []            # e.g. ["en-US", "de-DE"]; empty = automatic
accurate = true           # VNRequestTextRecognitionLevelAccurate
language_correction = true
engine = "vision"         # "vision" or an AI provider name

[markup]
stroke_color = "#FF3B30"
stroke_width = 4.0
# font_path = "/System/Library/Fonts/Supplemental/Arial Bold.ttf"
font_size = 28.0
background = "none"       # default for canvas.background = "auto"

[api]
bind = "127.0.0.1:4848"
# Bearer token required on every request when set. Recommended; required
# when `bind` is not a loopback address (the server refuses to start).
# token = "change-me"
# Let browser pages call the API. Only takes effect when a token is set.
cors = false

# Global hotkeys for the menu-bar app (`bugle-app`). "mod+mod+key"; modifiers
# cmd, shift, alt/option, ctrl; keys: letters, digits, F1..F24, space, enter…
# An empty string unbinds the action. Every menu item can be bound; unknown
# keys, non-string values and clashing or unparsable bindings are skipped with
# a warning (the config still loads).
[hotkeys]
capture_area = "cmd+shift+4"
capture_screen = "cmd+shift+3"
# capture_window = "cmd+shift+w"
# scroll_capture = "cmd+shift+s"
record = "cmd+shift+5"        # starts an MP4 recording, or stops the active one
# record_gif = "cmd+shift+g"
# record_window = "cmd+shift+r"     # pick a window and record it (MP4)
ocr_latest = "cmd+shift+2"
pin_latest = "cmd+shift+p"
# annotate_latest = "cmd+shift+e"   # markup editor for the newest screenshot
# stop_recording = "cmd+shift+."
# sync_latest = "ctrl+alt+s"
# open_folder = "ctrl+alt+o"
# toggle_api = "ctrl+alt+a"
# preferences = "ctrl+alt+,"
# quit = "ctrl+alt+q"

# Quick-access panel shown by `bugle-app` after a capture: thumbnail plus
# Copy · Annotate · Pin · Sync · Reveal and a close (×) button. `enabled = false`
# keeps the plain toast.
[quick_access]
enabled = true
# Closes by itself after this many seconds, but never while the pointer is over
# it (and up to 2 s after the pointer leaves). 0 = stay open until a button or ×.
timeout_seconds = 8.0
position = "bottom-right" # bottom-right | bottom-left | top-right | top-left
# What Annotate opens: "builtin" is Bugle's markup editor, which saves an
# annotated copy. A bundle id (e.g. "com.apple.Preview") opens that app instead;
# edits there change the saved file in place.
annotate_app = "builtin"

# ---------------------------------------------------------------------------
# Sync every new capture to storage you own. There is no hosted service: pick
# a folder that Dropbox / iCloud Drive / Syncthing already mirrors, or an
# S3-compatible bucket (AWS S3, MinIO, Garage, Cloudflare R2, Backblaze B2…).
# Set `folder` OR `[sync.s3]`, never both. `bugle sync <source|latest>` syncs
# on demand even when `enabled = false`.
# ---------------------------------------------------------------------------
[sync]
enabled = false
mode = "copy"             # copy | move  (move: the history entry follows the file;
                          # uploads always keep the local file)
# Kinds synced automatically. Only saves run the automatic step: screenshot,
# scroll_capture, annotated, video, gif — plus subtitle, for files `bugle subtitles`
# writes. audio and text are synced only on demand (`bugle sync`).
kinds = ["screenshot", "scroll_capture", "annotated", "video", "gif"]
# folder = "~/Library/Mobile Documents/com~apple~CloudDocs/Bugle"   # iCloud Drive
# folder = "~/Dropbox/Bugle"
sidecars = true           # .srt/.vtt subtitles follow their video, under its synced name;
                          # a file Bugle did not write is never replaced (a unique name is used)

# [sync.s3]
# endpoint = "https://s3.eu-west-1.amazonaws.com"   # or http://127.0.0.1:9000 (MinIO),
#                                                   # https://<account>.r2.cloudflarestorage.com
# bucket = "my-captures"
# region = "eu-west-1"                              # "auto" for R2
# prefix = "bugle"                                  # key prefix, trailing "/" implied
# access_key_env = "AWS_ACCESS_KEY_ID"              # credentials stay in your environment
# secret_key_env = "AWS_SECRET_ACCESS_KEY"
# public_url = "https://captures.example.com"       # link base; default {endpoint}/{bucket}
# multipart_threshold_mb = 64     # larger files stream up as a multipart upload… (max 5120)
# part_size_mb = 16               # …in parts of this size (5..=5120)
# Tip: add a bucket lifecycle rule that aborts incomplete multipart uploads after a
# day or so; an upload cut short by a crash or a lost response is otherwise kept.
# The object URL is written to history (`url`) and, unless general.copy_to_clipboard
# puts the image there, copied to the clipboard.

# A destination per media kind (screenshot, scroll_capture, annotated, video, gif,
# audio, subtitle, text). Kinds without an entry use the destination above. An
# entry also makes its kind sync automatically when that kind is saved (see `kinds`
# for which are). Each entry takes its own `folder` or `[...s3]` table, or just
# `prefix` (a relative sub-folder / key prefix under the default destination, no
# `..`), and an optional `mode` (folders only). A `subtitle` entry takes subtitles
# away from their video's destination; they keep the video's name.
# [sync.destinations.video]
# prefix = "recordings"
# [sync.destinations.gif]
# folder = "~/Dropbox/GIFs"
# mode = "move"
# [sync.destinations.screenshot.s3]
# endpoint = "http://127.0.0.1:9000"
# bucket = "screenshots"

# ---------------------------------------------------------------------------
# AI providers. Kinds:
#   openai      any OpenAI-compatible server (llama.cpp `llama-server`,
#               LM Studio, vLLM, Ollama's /v1, OpenAI, OpenRouter, Groq…)
#               roles: vision, text, transcriber (/audio/transcriptions)
#   ollama      Ollama native API                          roles: vision, text
#   anthropic   Anthropic Messages API                     roles: vision, text
#   whisper_cpp whisper.cpp `server` (/inference)          roles: transcriber
#   command     run a local program                        roles: all
# ---------------------------------------------------------------------------
[ai]
default_vision = "llama"
default_text = "llama"
default_transcriber = "whisper"

[ai.providers.llama]
kind = "openai"
base_url = "http://127.0.0.1:8080/v1"      # llama-server -m llava.gguf --mmproj ...
model = "default"
system_prompt = "You describe screenshots precisely. Name the application, the key UI elements, and any visible text. Be concise."
timeout_seconds = 180
max_tokens = 1024

[ai.providers.ollama]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "llava"

[ai.providers.whisper]
kind = "whisper_cpp"
base_url = "http://127.0.0.1:8178"         # whisper-server -m ggml-base.en.bin --port 8178

[ai.providers.openai]
kind = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"

[ai.providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"

# A local whisper-cli: {input} {output} {language} {prompt} {model} are substituted.
# The program must write SRT to {output} (or `<input>.srt`, or stdout).
# [ai.providers.whisper-cli]
# kind = "command"
# command = ["whisper-cli", "-m", "/models/ggml-base.en.bin", "-l", "{language}", "-osrt", "-of", "{output}", "-f", "{input}"]
